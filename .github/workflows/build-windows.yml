name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'tools/smoke_windows_installer.ps1'
      - 'tools/smoke_frozen.py'
      - 'tools/generate_mobile_qrs.py'
      - 'build_windows.bat'
      - 'installer.iss'
      - 'agent/**'
      - 'vendor/**'
      - 'installer_assets/**'
      - 'autorip/**'
      - 'autorip_gui.py'
      - 'requirements*.txt'
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-windows.yml'
      - 'tools/smoke_windows_installer.ps1'
      - 'tools/smoke_frozen.py'
      - 'tools/generate_mobile_qrs.py'
      - 'build_windows.bat'
      - 'installer.iss'
      - 'agent/**'
      - 'vendor/**'
      - 'installer_assets/**'
      - 'autorip/**'
      - 'autorip_gui.py'
      - 'requirements*.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            agent/requirements.txt

      - name: Conferir versao da tag e do instalador
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release_version.py "${{ github.ref_name }}"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller
          if (Test-Path 'agent/requirements.txt') { python -m pip install -r agent/requirements.txt }

      - name: Verify PyInstaller availability
        run: python -m PyInstaller --version

      - name: Run regression tests before Windows packaging
        run: python -m pytest -q

      - name: Build one-file executables and installer
        run: .\build_windows.bat

      - name: Smoke test do executavel empacotado
        shell: pwsh
        run: |
          $version = python -c "from autorip import __version__; print(__version__)"
          python tools/smoke_frozen.py dist/AutoRIP/AutoRIP.exe $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify artifacts
        shell: powershell
        run: |
          if (-not (Test-Path 'dist\AutoRIP\AutoRIP.exe')) { throw 'AutoRIP.exe não foi gerado' }
          if ((Test-Path 'agent\print_agent.py') -and -not (Test-Path 'dist\PrintExpAgent\PrintExpAgent.exe')) { throw 'PrintExpAgent.exe não foi gerado' }
          if (-not (Test-Path 'Output\AutoRIP_Setup.exe')) { throw 'AutoRIP_Setup.exe não foi gerado' }
          Get-ChildItem 'dist\AutoRIP\AutoRIP.exe', 'Output\AutoRIP_Setup.exe' | Select-Object FullName, Length
          if (Test-Path 'dist\PrintExpAgent\PrintExpAgent.exe') { Get-Item 'dist\PrintExpAgent\PrintExpAgent.exe' | Select-Object FullName, Length }

      - name: Smoke test installed executable
        shell: powershell
        run: |
          $version = python -c "from autorip import __version__; print(__version__)"
          .\tools\smoke_windows_installer.ps1 -SetupPath Output\AutoRIP_Setup.exe -ExpectedVersion $version -ExercisePortFallback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release checksums
        shell: powershell
        run: |
          $files = @('dist\AutoRIP\AutoRIP.exe', 'Output\AutoRIP_Setup.exe')
          if (Test-Path 'dist\PrintExpAgent\PrintExpAgent.exe') { $files += 'dist\PrintExpAgent\PrintExpAgent.exe' }
          Remove-Item SHA256SUMS.txt -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          }

      - name: Upload executable and installer
        uses: actions/upload-artifact@v6
        with:
          name: AutoRIP-Windows-${{ github.sha }}
          if-no-files-found: warn
          path: |
            dist/AutoRIP/AutoRIP.exe
            dist/PrintExpAgent/PrintExpAgent.exe
            Output/AutoRIP_Setup.exe
            SHA256SUMS.txt
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: AutoRIP-Windows-${{ github.sha }}
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRIP ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/AutoRIP/AutoRIP.exe
            dist/PrintExpAgent/PrintExpAgent.exe
            Output/AutoRIP_Setup.exe
            SHA256SUMS.txt
