name: CI/CD Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: autorip-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest -q

  build-windows:
    name: Build Windows and Inno Setup
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            agent/requirements.txt

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release_version.py "${{ github.ref_name }}"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller
          if (Test-Path 'agent/requirements.txt') { python -m pip install -r agent/requirements.txt }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build executables and installer
        run: .\build_windows.bat

      - name: Smoke test packaged PrintExp agent network discovery
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'autorip-agent-network.json'
          $process = Start-Process -FilePath 'dist\PrintExpAgent\PrintExpAgent.exe' -ArgumentList @('--network-info', ('"{0}"' -f $report)) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Falha ao consultar IPv4 no agente empacotado.' }
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($null -eq $data.PSObject.Properties['local_ipv4s']) { throw 'Relatorio IPv4 ausente.' }
          if (-not $data.discovery_library) { throw 'Biblioteca de descoberta ausente do pacote.' }

      - name: Smoke test packaged AutoRIP
        shell: pwsh
        run: |
          $version = python -c "from autorip import __version__; print(__version__)"
          python tools/smoke_frozen.py dist/AutoRIP/AutoRIP.exe $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify artifacts
        shell: powershell
        run: |
          if (-not (Test-Path 'dist\AutoRIP\AutoRIP.exe')) { throw 'AutoRIP.exe não foi gerado' }
          if ((Test-Path 'agent\print_agent.py') -and -not (Test-Path 'dist\PrintExpAgent\PrintExpAgent.exe')) { throw 'PrintExpAgent.exe não foi gerado' }
          if (-not (Test-Path 'Output\AutoRIP_Setup.exe')) { throw 'AutoRIP_Setup.exe não foi gerado' }
          Get-ChildItem 'dist\AutoRIP\AutoRIP.exe', 'Output\AutoRIP_Setup.exe' | Select-Object FullName, Length
          if (Test-Path 'dist\PrintExpAgent\PrintExpAgent.exe') { Get-Item 'dist\PrintExpAgent\PrintExpAgent.exe' | Select-Object FullName, Length }

      - name: Smoke test installed executable
        shell: pwsh
        run: |
          $version = python -c "from autorip import __version__; print(__version__)"
          .\tools\smoke_windows_installer.ps1 -SetupPath Output\AutoRIP_Setup.exe -ExpectedVersion $version -ExercisePortFallback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release checksums
        shell: powershell
        run: |
          $files = @('dist\AutoRIP\AutoRIP.exe', 'Output\AutoRIP_Setup.exe')
          if (Test-Path 'dist\PrintExpAgent\PrintExpAgent.exe') { $files += 'dist\PrintExpAgent\PrintExpAgent.exe' }
          Remove-Item SHA256SUMS.txt -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: AutoRIP-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/AutoRIP/AutoRIP.exe
            dist/PrintExpAgent/PrintExpAgent.exe
            Output/AutoRIP_Setup.exe
            SHA256SUMS.txt
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: AutoRIP-Windows-${{ github.sha }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRIP ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/AutoRIP/AutoRIP.exe
            dist/PrintExpAgent/PrintExpAgent.exe
            Output/AutoRIP_Setup.exe
            SHA256SUMS.txt
