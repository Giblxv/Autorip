name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Conferir versao da tag e do instalador
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release_version.py "${{ github.ref_name }}"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build one-file executable
        run: .\build_windows.bat

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify artifacts
        shell: powershell
        run: |
          if (-not (Test-Path 'dist\AutoRIP\AutoRIP.exe')) { throw 'AutoRIP.exe não foi gerado' }
          if (-not (Test-Path 'Output\AutoRIP_Setup.exe')) { throw 'AutoRIP_Setup.exe não foi gerado' }
          Get-Item 'dist\AutoRIP\AutoRIP.exe', 'Output\AutoRIP_Setup.exe' | Select-Object FullName, Length

      - name: Create release checksums
        shell: powershell
        run: |
          $exe = (Get-FileHash 'dist\AutoRIP\AutoRIP.exe' -Algorithm SHA256).Hash.ToLower()
          $setup = (Get-FileHash 'Output\AutoRIP_Setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$exe  AutoRIP.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          "$setup  AutoRIP_Setup.exe" | Out-File -Encoding ascii -Append SHA256SUMS.txt

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoRIP-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/AutoRIP/AutoRIP.exe
            Output/AutoRIP_Setup.exe
            SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AutoRIP/AutoRIP.exe
            Output/AutoRIP_Setup.exe
            SHA256SUMS.txt
