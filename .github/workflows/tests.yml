name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Testes ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Executar regressões
        run: python -m pytest -q

  regressao-15x:
    name: Regressão 15x ${{ matrix.os }} / Python 3.12
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar regressão completa 15 vezes
        run: python tools/repeat_regression.py --rounds 15 --output validation-15x.md
      - name: Publicar resumo
        if: always()
        shell: bash
        run: |
          if [ -f validation-15x.md ]; then
            cat validation-15x.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validação não iniciou; nenhuma rodada aprovada." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar relatório por ambiente
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validacao-15x-${{ matrix.os }}
          path: validation-15x.md
          if-no-files-found: warn
