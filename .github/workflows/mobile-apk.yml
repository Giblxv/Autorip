name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify mobile release versions
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: python3 tools/check_mobile_release_version.py "${{ github.ref_name }}"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build debug, optimized and release APKs
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          cd android
          ./gradlew assembleDebug assembleOptimized assembleRelease --no-daemon
      - name: Verify optimized APK and compare package sizes
        working-directory: mobile
        run: |
          set -euo pipefail
          debug_apk=android/app/build/outputs/apk/debug/app-debug.apk
          optimized_apk=android/app/build/outputs/apk/optimized/app-optimized.apk
          release_apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$debug_apk"
          test -s "$optimized_apk"
          test -s "$release_apk"
          unzip -tq "$optimized_apk"
          debug_bytes=$(stat -c '%s' "$debug_apk")
          optimized_bytes=$(stat -c '%s' "$optimized_apk")
          release_bytes=$(stat -c '%s' "$release_apk")
          saved_pct=$(awk -v d="$debug_bytes" -v o="$optimized_bytes" 'BEGIN { if (d > 0) printf "%.1f", (d-o)*100/d; else print "0.0" }')
          {
            echo '### Android APK sizes'
            echo '| Variant | Size |'
            echo '|---|---:|'
            echo "| Debug baseline | $debug_bytes bytes |"
            echo "| Optimized (R8 + resource shrink) | $optimized_bytes bytes |"
            echo "| Release (unsigned) | $release_bytes bytes |"
            echo "| Optimized size change vs debug | ${saved_pct}% smaller (negative means larger) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRIP-Mobile-optimized-${{ github.sha }}
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/optimized/app-optimized.apk
          retention-days: 30
      - name: Prepare preview release assets
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          mkdir -p release-assets
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-assets/AutoRIP-Mobile-debug.apk
          cp mobile/android/app/build/outputs/apk/optimized/app-optimized.apk release-assets/AutoRIP-Mobile-optimized.apk
          cp mobile/COMO_USAR.txt release-assets/COMO_USAR.txt
          (cd release-assets && sha256sum AutoRIP-Mobile-debug.apk AutoRIP-Mobile-optimized.apk > SHA256SUMS.txt)
      - name: Publish mobile release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRIP Mobile 0.2.0 (prévia)
          prerelease: true
          body_path: docs/releases/mobile-v0.2.0.md
          files: |
            release-assets/AutoRIP-Mobile-debug.apk
            release-assets/AutoRIP-Mobile-optimized.apk
            release-assets/COMO_USAR.txt
            release-assets/SHA256SUMS.txt
