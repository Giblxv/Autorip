name: Validação integrada recuperação #40-#41

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    if: github.head_ref == 'review/integracao-040-041'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testar regressões conjuntas
        run: python -m pytest -q
